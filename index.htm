<html lang="az">

    <meta charset="UTF-8">

    <title>Qeydiyyat Formu | Premium Dizayn</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            --card-bg: rgba(255, 255, 255, 0.95);
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --input-focus: #6366f1;
            --radius: 12px;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            color: var(--text-main);
        }

        .container {
            background: var(--card-bg);
            width: 100%;
            max-width: 800px;
            padding: 40px;
            border-radius: 24px;
            box-shadow: var(--shadow);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            margin-bottom: 32px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .header p {
            color: var(--text-muted);
            font-size: 16px;
        }

        form {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 24px;
        }

        .full-width {
            grid-column: span 2;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-main);
            margin-left: 4px;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"],
        input[type="tel"],
        input[type="number"],
        input[type="date"],
        select,
        textarea {
            padding: 12px 16px;
            border-radius: var(--radius);
            border: 1px solid var(--border-color);
            background: white;
            font-family: inherit;
            font-size: 15px;
            transition: all 0.2s ease;
            outline: none;
        }

        input:focus, select:focus, textarea:focus {
            border-color: var(--input-focus);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1);
        }

        .gender-group {
            display: flex;
            gap: 20px;
            padding: 10px 0;
        }

        .radio-option {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .radio-option input[type="radio"] {
            width: 18px;
            height: 18px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .range-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        input[type="range"] {
            flex-grow: 1;
            accent-color: var(--primary);
        }

        .range-value {
            min-width: 45px;
            font-weight: 600;
            color: var(--primary);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .actions {
            margin-top: 16px;
            display: flex;
            gap: 16px;
        }

        button {
            padding: 14px 28px;
            border-radius: var(--radius);
            font-family: inherit;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.2s ease;
            border: none;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            flex-grow: 2;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.25);
        }

        .btn-secondary {
            background: #f1f5f9;
            color: var(--text-main);
            flex-grow: 1;
        }

        .btn-secondary:hover {
            background: #e2e8f0;
        }

        .profile-preview-container {
            display: flex;
            justify-content: center;
            margin-bottom: 24px;
        }

        .profile-preview {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid white;
            box-shadow: var(--shadow);
            overflow: hidden;
            background: #f1f5f9;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .profile-preview:hover {
            transform: scale(1.05);
            border-color: var(--primary);
        }

        .profile-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }

        .profile-preview i {
            font-size: 40px;
            color: var(--text-muted);
        }

        .profile-preview .upload-hint {
            position: absolute;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            color: white;
            width: 100%;
            font-size: 10px;
            padding: 4px 0;
            text-align: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .profile-preview:hover .upload-hint {
            opacity: 1;
        }

        @media (max-width: 600px) {
            form {
                grid-template-columns: 1fr;
            }
            .full-width {
                grid-column: span 1;
            }
            .container {
                padding: 24px;
            }
        }
    </style>
</head>

                <label for="address">Tam Ünvan (Küçə, Ev, Mənzil)</label>
                <input type="text" id="address" name="address" placeholder="Məs: Mətbuat pr. 25, mənzil 10">
            </div>
            <div class="form-group">
                <label for="social">Sosial Media (LinkedIn/GitHub)</label>
                <input type="text" id="social" name="social" placeholder="linkedin.com/in/username">
            </div>

            <!-- Standart: Haqqında -->
            <div class="form-group full-width">
                <label for="bio">Haqqında (Qısa məlumat)</label>
                <textarea id="bio" name="bio" placeholder="Özünüz barədə bir neçə kəlmə yazın..."></textarea>
            </div>

            <!-- Standart: Fayl Yükləmə -->
            <div class="form-group full-width">
                <label for="profile-pic">Profil Şəkli</label>
                <input type="file" id="profile-pic" name="profile-pic" accept="image/*">
            </div>

            <!-- Standart: Razılıq -->
            <div class="form-group full-width">
                <label class="radio-option">
                    <input type="checkbox" required style="width: 18px; height: 18px; accent-color: var(--primary);"> Şərtlər və Qaydalar ilə razıyam
                </label>
            </div>

            <!-- Actions -->
            <div class="actions full-width">
                <button type="submit" class="btn-primary">Qeydiyyatdan Keç</button>
                <button type="reset" class="btn-secondary">Sıfırla</button>
            </div>
        </form>
    </div>

    <script>
        const profileInput = document.getElementById('profile-pic');
        const previewImg = document.getElementById('preview-img');
        const placeholderIcon = document.getElementById('placeholder-icon');

        profileInput.onchange = evt => {
            const [file] = profileInput.files;
            if (file) {
                previewImg.src = URL.createObjectURL(file);
                previewImg.style.display = 'block';
                placeholderIcon.style.display = 'none';
            }
        }
    </script>
</body>
</html>
